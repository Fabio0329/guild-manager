# Runs the same checks as `npm run check`, plus a production build, on every
# pull request and every push to main. Each check is its own step so a
# failure shows exactly which one broke.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres for the page tests, same version as compose.yaml. The tests
    # create guild_manager_test in it and apply the migrations themselves.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: guild_manager
          POSTGRES_PASSWORD: guild_manager
          POSTGRES_DB: guild_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guild_manager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # server/env.ts refuses to start without these, and the build loads the
    # auth route. Placeholders: the page tests replace them with their own
    # values (test/e2e/env.ts), pointed at TEST_DATABASE_URL below. Real
    # values live in .env.local and the host's settings.
    env:
      TEST_DATABASE_URL: postgresql://guild_manager:guild_manager@localhost:5432/guild_manager_test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-for-anything
      BETTER_AUTH_URL: http://localhost:3100
      BATTLENET_CLIENT_ID: ci-placeholder
      BATTLENET_CLIENT_SECRET: ci-placeholder
      DISCORD_CLIENT_ID: "0"
      DISCORD_CLIENT_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Its postinstall script also generates the Prisma client. No database
      # is needed: generating reads only prisma/schema.prisma.
      - name: Install dependencies
        run: npm ci

      - name: Lint (strict jsx-a11y, zero warnings)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component a11y tests
        run: npm test

      # The page tests build the app again for themselves; this step makes a
      # build failure show up under its own name.
      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Page-level a11y tests
        run: npm run test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
